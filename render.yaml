services:
  - type: web
    name: ruiru-prime-properties
    runtime: docker
    plan: free
    region: frankfurt
    envVars:
      # Optional: set these for MySQL (e.g. from Aiven/Railway/PlanetScale)
      # Leave blank to use the bundled SQLite database automatically
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: PORT
        value: "10000"
    # Optional persistent disk: Requires Starter plan ($7/mo+) or above.
    # On Free plan, leave commented out to use container storage.
    # disk:
    #   name: uploads
    #   mountPath: /var/www/html/uploads
    #   sizeGB: 1
