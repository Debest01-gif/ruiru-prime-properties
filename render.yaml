services:
  - type: web
    name: ruiru-prime-properties
    runtime: docker
    plan: free
    region: frankfurt
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_PORT
        value: "3306"
